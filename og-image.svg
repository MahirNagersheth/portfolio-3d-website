<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%"   stop-color="#1a1830"/>
      <stop offset="60%"  stop-color="#0c0d18"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe79a"/>
      <stop offset="55%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#c4651e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffa84a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c41e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#d6b25e"/>
    </linearGradient>
    <filter id="planetShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="0" result="off"/>
      <feMerge>
        <feMergeNode in="off"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80"  r="1.2"/>
    <circle cx="280" cy="160" r="0.8"/>
    <circle cx="450" cy="60"  r="1.4"/>
    <circle cx="660" cy="120" r="0.9"/>
    <circle cx="850" cy="80"  r="1.1"/>
    <circle cx="1020" cy="180" r="1.3"/>
    <circle cx="1100" cy="60"  r="0.8"/>
    <circle cx="180" cy="540" r="1.2"/>
    <circle cx="380" cy="510" r="0.9"/>
    <circle cx="610" cy="560" r="1.0"/>
    <circle cx="820" cy="500" r="1.4"/>
    <circle cx="970" cy="540" r="0.8"/>
    <circle cx="1080" cy="490" r="1.1"/>
    <circle cx="60"  cy="320" r="0.9"/>
    <circle cx="1130" cy="320" r="1.0"/>
  </g>

  <!-- Solar system on the right side. Sun + 7 orbital rings + dot per orbit. -->
  <g transform="translate(800, 315)">
    <!-- Orbit rings -->
    <g stroke-width="1" fill="none" opacity="0.18">
      <ellipse cx="0" cy="0" rx="40"  ry="14"  stroke="#d6b25e"/>
      <ellipse cx="0" cy="0" rx="68"  ry="22"  stroke="#c41e3a" transform="rotate(-6)"/>
      <ellipse cx="0" cy="0" rx="98"  ry="32"  stroke="#4a7ff5" transform="rotate(8)"/>
      <ellipse cx="0" cy="0" rx="130" ry="42"  stroke="#b46be0" transform="rotate(-10)"/>
      <ellipse cx="0" cy="0" rx="166" ry="54"  stroke="#4ad991" transform="rotate(6)"/>
      <ellipse cx="0" cy="0" rx="208" ry="68"  stroke="#4ed5cf" transform="rotate(-4)"/>
      <ellipse cx="0" cy="0" rx="252" ry="82"  stroke="#e8e8e8" transform="rotate(10)"/>
    </g>

    <!-- Sun corona -->
    <circle cx="0" cy="0" r="120" fill="url(#sunGlow)"/>
    <circle cx="0" cy="0" r="18"  fill="url(#sun)"/>

    <!-- Planets along the orbits, sized & colored to match the site -->
    <circle cx="-32"  cy="-8"  r="6.0" fill="#d6b25e"/>
    <ellipse cx="-32" cy="-8"  rx="11" ry="2.4" fill="none" stroke="#f6d99a" stroke-width="0.9" opacity="0.7"/>
    <circle cx="58"   cy="14"  r="5.0" fill="#c41e3a"/>
    <circle cx="-86"  cy="22"  r="4.2" fill="#4a7ff5"/>
    <circle cx="112"  cy="-26" r="3.6" fill="#b46be0"/>
    <circle cx="-148" cy="-40" r="4.0" fill="#4ad991"/>
    <ellipse cx="-148" cy="-40" rx="7"  ry="1.8" fill="none" stroke="#8effc1" stroke-width="0.8" opacity="0.7"/>
    <circle cx="190"  cy="48"  r="3.6" fill="#4ed5cf"/>
    <circle cx="-238" cy="58"  r="3.0" fill="#e8e8e8"/>
  </g>

  <!-- Identity block on the left -->
  <g transform="translate(80, 235)">
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="500"
          letter-spacing="6" fill="#a4adbe">★ THE SUN</text>
    <text y="80" font-family="'Space Grotesk', system-ui, sans-serif" font-size="78" font-weight="700"
          letter-spacing="-2" fill="url(#name)">Mahir Nagersheth</text>
    <text y="125" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#c8ccd5">
      Carnegie Mellon
      <tspan font-weight="600" fill="#ffffff"> MISM</tspan>
      ·  Incoming
      <tspan font-weight="600" fill="#d6b25e"> Goldman Sachs</tspan>
    </text>
    <text y="155" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#c8ccd5">
      Engineering Summer Analyst — Risk Division, Dallas
    </text>

    <!-- Footer line -->
    <text y="225" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="500"
          letter-spacing="3" fill="#6b7382">A 3D PORTFOLIO IN THE COSMOS · CLICK A PLANET TO EXPLORE</text>
  </g>
</svg>
